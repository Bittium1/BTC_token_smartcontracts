name: Contracts CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chain-wrappers:
    name: Chain wrapper integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - name: Reject tracked private-key literals
        run: node scripts/verify-no-private-keys.cjs
      - name: Verify Base and Kava wrappers
        run: node scripts/verify-chain-wrappers.cjs

  modules:
    name: ${{ matrix.module }}
    needs: chain-wrappers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - evm-base-contracts
          - ethereum
          - tron
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: ${{ matrix.module }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Compile contracts
        run: npm run compile
      - name: Run tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=low
